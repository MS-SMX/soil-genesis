1:
  title: Dormienza
  text: >
    Proposito per il nuovo anno: rifiutare il dogma,
    vivere secondo la regola del "caso per caso".

2:
  title: Attesa
  text: >
    Ogni seme conservato è un rifiuto
    dell'idea che il futuro sia già scritto.

3:
  title: Inizio
  text: >
    Seminare significa accettare
    che non tutto dipende da noi.
    Ed è proprio questo il punto.

4:
  title: Espansione
  text: >
    La biodiversità non produce uniformità.
    Produce possibilità.

5:
  title: Crescita
  text: >
    L'agricoltura industriale coltiva prodotti.
    L'agricoltura rigenerativa coltiva ecosistemi.

6:
  title: Equilibrio
  text: >
    Un terreno fertile
    non è una risorsa.
    È una relazione.

7:
  title: Maturazione
  text: >
    Ogni varietà è il risultato
    di migliaia di decisioni
    prese da persone ormai dimenticate.

8:
  title: Raccolta
  text: >
    Quei peperoni prima o poi saranno grandi come quelli coltivati ad Asti. 

9:
  title: Trasmissione
  text: >
    THE END IS NEVER THE END IS NEVER THE END IS NEVER THE END

10:
  title: Memoria
  text: >
    Le sementi non custodiscono soltanto DNA.
    Custodiscono errori,
    adattamenti
    e tentativi riusciti.

11:
  title: Riposo
  text: >
    Anche i sistemi resilienti
    hanno bisogno di fermarsi
    per continuare a evolvere.

12:
  title: Continuità
  text: >
    La libertà di una comunità
    inizia quando può riprodurre
    il proprio cibo.