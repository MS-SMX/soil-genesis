{% assign group = include.group %}
{% assign fields = site.data.core.fields[group] %}

<table>

{% for item in fields %}

    {% assign key = item[0] %}
    {% assign config = item[1] %}
    {% assign value = page[key] %}

    {% if value %}

    <tr>

        <td>{{ config.label }}</td>

        <td>{{ value }}</td>

    </tr>

    {% endif %}

{% endfor %}

</table>
