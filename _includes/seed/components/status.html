{% assign status = include.value | downcase %}

<span class="status status-{{ status | replace:'_','-' }}">

{% case status %}

{% when "critico" %}
🔴 CRITICO

{% when "da_rigenerare" %}
🟠 DA RIGENERARE

{% when "stabile" %}
🟢 STABILE

{% when "abbondante" %}
🔵 ABBONDANTE

{% when "new_entry" %}
⚪ NEW ENTRY

{% else %}


{% endcase %}

</span>
