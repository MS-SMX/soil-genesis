<section class="sg-module">

    <header class="sg-module-header">

        <div>

            {% if include.module %}

            <div class="sg-module-id">

                {{ include.module }}

            </div>

            {% endif %}

            <h2 class="sg-module-title">

                {{ include.title }}

            </h2>

        </div>

    </header>

    <div class="sg-module-body">

        {{ include.content }}

    </div>

</section>
